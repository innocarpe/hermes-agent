# TemperStone HQ Discord bootstrap config
#
# This file is the practical starting point for bootstrapping the Discord workspace.
# Replace placeholder channel IDs once the server channels exist.

discord:
  bootstrap_guild_id: "1493165451910578196"
  bootstrap_channels:
    - name: "01-전략"
      topic: "전사 방향, 우선순위, 큰 베팅, 제외할 일. 여기서는 왜와 무엇을 정한다."
    - name: "02-개인사업자-운영"
      topic: "개인사업자 운영, 행정, 반복 프로세스, 오너 결정을 다룬다."
    - name: "02-제품"
      topic: "제품 범위, 로드맵, 요구사항, 우선순위, 리뷰를 다룬다."
    - name: "03-콘텐츠"
      topic: "콘텐츠 기획, 초안, 발행, 피드백, 성과를 다룬다."
    - name: "04-채널"
      topic: "Discord, Telegram, 플랫폼 구조, 권한, 라우팅, 채널 운영 정책을 다룬다."
    - name: "05-운영"
      topic: "자동화, 서비스 상태, 워크플로우, 장애/경보, 운영 라우팅을 다룬다."
    - name: "06-재무"
      topic: |
        재무 전용.
        이 채널은 현금흐름, 매출/비용, 정산, 회계, 세금, 예산, 마진, 수익성을 다룬다.
        돈의 흐름과 비용 구조를 숫자로 정리하고, 판단 근거를 함께 남긴다.
        기록할 때는 금액·기간·대상·사유를 같이 적는다.
        비용 절감, 투자, 지출 우선순위, 정산 상태, 세무/증빙 누락을 점검한다.
        다른 축의 토론은 여기로 끌고 오지 말고, 재무에 영향을 주는 지점만 남긴다.
        결론은 짧게, 근거는 구체적으로, 다음 액션은 명시적으로 적는다.
    - name: "07-회고"
      topic: "회고, 결정 복기, 문제 원인, 개선 액션을 정리한다."
    - name: "08-브랜딩"
      topic: "브랜드 톤, 네이밍, 메시지, 대외 인상을 다룬다."
    - name: "09-아카이브"
      topic: "완료·종료된 항목과 참고용 이력을 보관한다."

