# Discord channel ID mapping template
#
# Step to use after bootstrap channels are created in Discord.
#
# 1. Turn on Discord Developer Mode.
# 2. Right-click each channel.
# 3. Copy the channel ID.
# 4. Paste it into the mapping below.
# 5. Use the IDs in allowed_channels / free_response_channels / no_thread_channels.

discord:
  channels:
    - name: "01-전략"
      id: ""
      role: "working"

    - name: "02-개인사업자-운영"
      id: ""
      role: "working"

    - name: "02-제품"
      id: ""
      role: "working"

    - name: "03-콘텐츠"
      id: ""
      role: "working"

    - name: "04-채널"
      id: ""
      role: "working"

    - name: "05-운영"
      id: ""
      role: "working"

    - name: "06-재무"
      id: ""
      role: "working"

    - name: "07-회고"
      id: ""
      role: "working"

    - name: "08-브랜딩"
      id: ""
      role: "working"

    - name: "09-아카이브"
      id: ""
      role: "archive"

  # Recommended initial policy after IDs are filled in.
  # - allowed_channels: all working channels
  # - no_thread_channels: channels where you want direct replies only
  # - free_response_channels: channels that should not require mention
  allowed_channels:
    - ""

  free_response_channels:
    - ""

  no_thread_channels:
    - ""

  channel_skill_bindings:
    - id: ""
      skills:
        - "bd-intake"

    - id: ""
      skills:
        - "bd-review"

    - id: ""
      skills:
        - "decision-log"
