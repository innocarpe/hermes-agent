# Recommended operating policy for the TemperStone HQ Discord workspace
#
# Purpose:
# - make the initial Discord setup usable on day 1
# - keep channel behavior explicit and non-abbreviated
# - separate intake, working, and archive channels cleanly

policy:
  description: "Initial channel behavior map for Hermes / TemperStone HQ"

  channels:
    - name: "01-전략"
      mode: "free_response"
      thread_policy: "no_thread"
      notes: "High-level planning and direction-setting"

    - name: "02-개인사업자-운영"
      mode: "free_response"
      thread_policy: "auto_thread"
      notes: "Owner operations, process, and business admin"

    - name: "02-제품"
      mode: "free_response"
      thread_policy: "auto_thread"
      notes: "Product decisions, scope, roadmap, delivery"

    - name: "03-콘텐츠"
      mode: "free_response"
      thread_policy: "auto_thread"
      notes: "Content planning, drafts, publishing, feedback"

    - name: "04-채널"
      mode: "free_response"
      thread_policy: "no_thread"
      notes: "Discord / Telegram / platform operations"

    - name: "05-운영"
      mode: "free_response"
      thread_policy: "auto_thread"
      notes: "Automation, process ops, service health, routing"

    - name: "06-재무"
      mode: "free_response"
      thread_policy: "no_thread"
      notes: "Finance lane: cashflow, revenue/cost, settlement, accounting, tax, budgeting, margin, and profitability."

    - name: "07-회고"
      mode: "free_response"
      thread_policy: "no_thread"
      notes: "Retrospectives, lessons learned, review summaries"

    - name: "08-브랜딩"
      mode: "free_response"
      thread_policy: "auto_thread"
      notes: "Brand, tone, naming, public presence"

    - name: "09-아카이브"
      mode: "free_response"
      thread_policy: "no_thread"
      notes: "Closed items and historical record"

  defaults:
    allowed_channels:
      - "01-전략"
      - "02-개인사업자-운영"
      - "02-제품"
      - "03-콘텐츠"
      - "04-채널"
      - "05-운영"
      - "06-재무"
      - "07-회고"
      - "08-브랜딩"
      - "09-아카이브"

    free_response_channels:
      - "01-전략"
      - "02-개인사업자-운영"
      - "02-제품"
      - "03-콘텐츠"
      - "04-채널"
      - "05-운영"
      - "06-재무"
      - "07-회고"
      - "08-브랜딩"
      - "09-아카이브"

    no_thread_channels:
      - "01-전략"
      - "06-재무"
      - "07-회고"
      - "09-아카이브"

  binding_guidance:
    - channel: "02-개인사업자-운영"
      skills: ["bd-intake"]
    - channel: "02-제품"
      skills: ["bd-triage", "bd-review"]
    - channel: "05-운영"
      skills: ["hq-ops"]
    - channel: "06-재무"
      skills: ["finance-review"]
    - channel: "07-회고"
      skills: ["review-loop", "metrics-summary"]
    - channel: "08-브랜딩"
      skills: ["brand-review"]
