# TemperStone HQ Discord channel topics and activity guide
#
# This file describes the channel topic text Hermes should use when bootstrapping
# or updating channel descriptions.
#
# Channel names are the primary key. Numeric IDs are optional.

discord:
  channels:
    - name: "01-전략"
      topic: |
        TemperStone HQ의 전략 입구.
        이 채널은 큰 방향을 정하고, 무엇이 중요한지 우선순위를 고르며, 해야 할 일과 하지 않을 일을 가르고,
        새 요청을 어디로 보낼지 판단하는 곳이다.

        여기서는 결론을 빠르게 내리는 것이 핵심이다.
        방향, 범위, 타이밍, 리스크, 기대효과, 다음 액션을 짧고 명확하게 정리한다.

        세부 실행 계획, 제품 설계, 콘텐츠 초안, 운영 디버깅, 재무 정산, 회고는 각 전용 채널로 넘긴다.
        질문은 ‘이걸 할까?’, ‘지금 이게 맞나?’, ‘먼저 할 게 뭔가?’, ‘어디로 보내야 하나?’에 맞춘다.
      activities:
        - "새로운 큰 방향을 정리한다"
        - "우선순위를 결정한다"
        - "사업의 큰 베팅과 제외할 일을 적는다"

    - name: "02-개인사업자-운영"
      topic: "개인사업자 운영, 행정, 세금/정산, 반복 프로세스, 오너 결정을 다룬다. 운영 기준과 체크리스트를 쌓고, 매번 다시 묻지 않도록 절차를 문서화한다."
      activities:
        - "사업자 운영 관련 메모를 남긴다"
        - "반복 업무와 프로세스를 정리한다"
        - "오너가 직접 결정해야 하는 일을 다룬다"

    - name: "02-제품"
      topic: "제품 범위, 로드맵, 요구사항, 우선순위, 리뷰를 다룬다. 기능 제안이 들어오면 목적, 사용자 가치, 구현 비용, 릴리스 순서를 함께 정리하고, 실행 여부는 근거와 함께 남긴다."
      activities:
        - "기능 범위를 정의한다"
        - "로드맵과 우선순위를 논의한다"
        - "리뷰 결과와 수정 사항을 기록한다"

    - name: "03-콘텐츠"
      topic: "콘텐츠 기획, 초안, 발행, 피드백, 성과를 다룬다. 제목/구성/배포/리팩토링 기준을 정하고, 발행 후 반응과 다음 수정 방향까지 이어서 남긴다. 외부 벤치마크는 스타일 복제가 아니라 시장 크기, 경쟁 밀도, 리스크, 검수 조건으로 번역한다."
      activities:
        - "콘텐츠 아이디어를 모은다"
        - "초안과 수정안을 다룬다"
        - "발행 일정과 반응을 기록한다"
        - "벤치마크를 바탕으로 주제별 리스크와 검수 조건을 적는다"
        - "시장 크기와 경쟁 밀도를 함께 비교한다"

    - name: "04-채널"
      topic: |-
        채널 전략, 계정 구조, 배포/전환 설계 전용 채널.

        YouTube·Instagram·TikTok·X·뉴스레터·앱·SaaS처럼 외부 유입과 확산이 일어나는 접점을 여기서 설계한다.

        이 채널에서는 다음을 정한다.
        1) 어떤 채널을 열지/닫을지
        2) 개인·브랜드·실험 계정을 어떻게 나눌지
        3) 각 채널의 역할이 유입·신뢰·전환·수익화 중 무엇인지
        4) 어떤 콘텐츠/오퍼가 어떤 채널에서 작동하는지
        5) 운영 정책·권한·봇·라우팅·토픽 설정을 어떻게 둘지

        제작 초안이나 원고 자체는 `03-콘텐츠`로, 실행 결과와 운영 이슈는 `05-운영`으로 넘긴다.
        목표는 채널별로 ‘무엇을 올릴까’가 아니라 ‘어떤 구조로 유입·전환·확산을 만들까’를 결정하는 것이다.

        외부 벤치마크를 가져올 때는 스타일을 베끼지 말고, 실제 경쟁 클러스터·리스크·수익화 구조로 번역한다.
        YouTube·콘텐츠 벤치마크는 뉴스/해설/실무/아카이브 중 어디에 둘지 먼저 정하고, 고위험 니치는 source quality와 review gate를 붙인다.
      activities:
        - "채널 구조와 계정 구조를 설계한다"
        - "유입, 전환, 확산 방식을 정리한다"
        - "플랫폼 접점과 운영 정책을 조정한다"
        - "벤치마크를 채널 포지셔닝 기준으로 변환한다"
        - "YouTube 니치를 뉴스/해설/실무/아카이브로 먼저 분류한다"
        - "고위험 주제의 검수·면책·소스 관리 기준을 정한다"
        - "봇, 권한, 라우팅, 토픽 설정 이슈를 기록한다"
        - "무슨 채널을 열지, 닫을지, 분리할지 결정한다"

    - name: "05-운영"
      topic: "자동화, 서비스 상태, 워크플로우, 장애/경보, cron, routing, gateway, 운영 절차를 다룬다. 이 채널은 Hermes 자체의 작동 상태와 반복 작업 개선을 다루는 곳이며, 설정 변경·에러 분석·재시도 정책·헬스체크·복구 순서·메트릭·인계 규칙을 정리한다. 실행 가능한 조치만 남기고, 원인 추정과 결정 근거를 함께 기록한다."
      activities:
        - "자동화 규칙을 추가하거나 고친다"
        - "운영 이슈와 상태를 기록한다"
        - "반복 작업의 개선안을 정리한다"

    - name: "06-재무"
      topic: |
        재무 전용.
        이 채널은 현금흐름, 매출/비용, 정산, 회계, 세금, 예산, 마진, 수익성을 다룬다.
        돈의 흐름과 비용 구조를 숫자로 정리하고, 판단 근거를 함께 남긴다.
        기록할 때는 금액·기간·대상·사유를 같이 적는다.
        비용 절감, 투자, 지출 우선순위, 정산 상태, 세무/증빙 누락을 점검한다.
        다른 축의 토론은 여기로 끌고 오지 말고, 재무에 영향을 주는 지점만 남긴다.
        결론은 짧게, 근거는 구체적으로, 다음 액션은 명시적으로 적는다.
      activities:
        - "수입/지출을 기록한다"
        - "재무 관련 판단을 남긴다"
        - "정산과 회계 메모를 정리한다"

    - name: "07-회고"
      topic: "레포/운영 복기 채널입니다. 이 채널의 목적은 이미 끝난 작업과 운영 사건을 학습 가능한 기록으로 바꾸는 것입니다. 여기서는 새 과제를 시작하지 않습니다. 대신 완료된 일의 결과, 의사결정의 이유, 기대와 실제의 차이, 잘된 점, 실패한 점, 재발 원인, 다음에 바꿀 운영 원칙을 정리합니다. 메시지는 가능하면 사실→판단→교훈→다음 액션 순서로 적고, 감상보다 재현 가능한 교훈에 집중합니다. 적합한 주제는 배포/운영 결과 복기, 프로젝트 종료 후 리뷰, 결정 번복 사유, 반복 문제 분석, 프로세스 개선안, 후속 액션 정리입니다. 부적합한 주제는 새 기획 시작, 범위 확장 논의, 제품 설계 분해, 실행 전 준비회의, 재무·채널·브랜딩 같은 다른 축의 신규 작업입니다. 짧게 말하면, 이 채널은 '무엇을 만들까'가 아니라 '무엇을 배웠고 무엇을 바꿀까'를 다루는 곳입니다."
      activities:
        - "한 주/한 작업의 회고를 적는다"
        - "잘된 점과 실패한 점을 정리한다"
        - "다음 개선 액션을 기록한다"

    - name: "08-브랜딩"
      topic: "브랜딩 전용 채널. Hermes / TemperStone HQ의 이름, 말투, 소개 문구, 채널 설명, 공지, 첫인상, 외부 메시지를 다룬다. 여기서는 내부용 표현과 외부용 표현을 구분하고, 채널명·봇명·기능명 후보를 비교하며, 허용할 톤·금지할 표현·대외 소개 문안을 정리한다. 코드·운영·재무·제품 스펙은 다른 채널로 보낸다. 논의 결과는 docs/hq/branding.md와 decision-log로 옮겨 SSOT로 고정한다. 목표는 ‘회사처럼 운영되는 AI OS’라는 인상을 명확하고 친근한 존댓말로 일관되게 유지하는 것이다."
      activities:
        - "브랜드 톤과 말투를 정리한다"
        - "채널명, 봇명, 기능명, 소개 문구 후보를 비교한다"
        - "대외 메시지와 첫인상을 검토한다"
        - "내부자 표현과 외부용 표현을 구분한다"

    - name: "09-아카이브"
      topic: "완료·종료된 항목과 참고용 이력을 보관한다. 끝난 일만 남기고 새 작업은 만들지 않으며, 필요할 때 과거 결정을 빠르게 찾을 수 있도록 정리한다."
      activities:
        - "끝난 작업을 보관한다"
        - "예전 결정과 문서를 찾아본다"
        - "더 이상 수정하지 않을 항목을 남긴다"
